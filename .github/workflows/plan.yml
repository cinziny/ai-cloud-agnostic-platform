name: plan
on: [pull_request]

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terragrunt
        run: |
          TG_VERSION=0.55.2
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Terraform Plan (All Accounts)
        run: |
          terragrunt run --all plan -out=tfplan

      - name: Collect Terraform Plans
        run: |
          mkdir -p plans
          find . -name tfplan -exec cp --parents {} plans/ \;

      - name: Upload Terraform Plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          path: plans
