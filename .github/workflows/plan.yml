name: plan
on: [pull_request]

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install Terragrunt (legacy-compatible)
        run: |
          curl -L -o /tmp/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v0.46.3/terragrunt_linux_amd64
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform Plan (All Accounts)
        run: terragrunt run-all plan

      - name: Collect Terraform Plans
        run: |
          mkdir -p plans
          find . -name tfplan -o -name terraform.tfplan -exec cp --parents {} plans/ \;

      - name: Upload Terraform Plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          path: plans
          retention-days: 7