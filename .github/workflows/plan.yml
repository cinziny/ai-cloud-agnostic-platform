name: plan
on: [pull_request]

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Install Terragrunt
        run: |
          sudo wget -O /usr/local/bin/terragrunt https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          sudo chmod +x /usr/local/bin/terragrunt
      - run: terragrunt run-all plan